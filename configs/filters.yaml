# Scoring / gating thresholds. CALIBRATE against positive controls (GLP-1(7-36), exendin-4,
# orforglipron, Boc5) and scrambled negatives per-folder — NEVER use absolute cutoffs
# (community thresholds are soluble-derived and NOT membrane-validated; see research note 04).
# Every value here is a STARTING POINT to be re-centered on the controls; nothing is a wet-lab truth.

binding_engagement:          # CALIBRATED 2026-10-13 on 4 agonists vs 8 scrambles x3 seeds (Boltz-2, construct 24-432)
  # KEY CALIBRATION RESULT: global ipTM/pTM do NOT discriminate (scramble ties native, AUC~0.5) -> NOT a gate.
  # Native-agonist-LIKE engagement IS separated by BIPARTITE ECD-groove anchoring + interface PAE.
  aggregate_over_seeds: mean   # the separation is a per-design 3-seed MEAN; apply the gate on >=3-seed means, NOT a single seed
  discriminators:
    ecd_groove_anchor_count: {ge: 5}   # per-SEED 10/12 agonist pass, 1/24 scramble leak (83% sens / 96% spec); on 3-seed means AUC=1.00. PRIMARY.
    iPAE_min: {le: 4.0}                # AUC~0.88 (lower=agonist-like); None (pae npz missing) => treat as FAIL. SECONDARY.
  ipTM: not_a_gate                     # scr_s0 ipTM 0.957 ~ GLP-1 0.965; record, never rank on it
  note: >
    SCOPE (honest, measured 2026-10-13): this is a SPECIFIC-BINDER-vs-JUNK filter, NOT an agonism selector.
    Gate pass-rate: agonists 83%, ANTAGONISTS 56% (exendin(9-39) 2/3, GLP-1(9-37) 3/3 PASS like agonists),
    scrambles 4%. So it REJECTS non-binders but CANNOT separate agonist from antagonist (an ECD/core-anchoring
    antagonist passes). Agonism must rest on mechanism rationale + the wet-lab assay; no in-silico score proves
    agonism (research note 04). Only GLP-1(15-36) address-only fails (too few core contacts).
  folders: [boltz2]                    # calibrated on Boltz-2 ONLY; cutoffs do NOT transfer -> per-folder recalibration needed before using chai1/protenix as orthogonal votes (AF3 excluded, output-license)
  controls:
    positive_agonist: [GLP1_7_36, GLP1_7_37, exendin_4, liraglutide_bb]
    negative_scramble: [scr_s0, scr_s1, scr_s2, scr_s3, scr_s4, scr_s5, scr_s6, scr_s7]
    negative_antagonist: [exendin_9_39, GLP1_9_37, GLP1_15_36_addr]   # bind-like-address, no message
  scorer: scripts/iface_score.py   # emits ecd_groove_anchor_count (scalar) + iPAE_min + nterm_min_dist
  rfd_generation_target_cluster: [190, 194, 233, 234, 237]   # compact TM2/TM3 cluster (<=10.3A) from 6X18 GLP-1 message contacts; the GENERATION hotspot target, DISTINCT from the scoring vestibule set (target.yaml tm_message_reader == iface_score VESTIBULE)

agonism_hypothesis:          # HYPOTHESIS gate only — NO in-silico score proves agonism (note 04)
  active_state_template: 6X18
  require_message_in_vestibule: true     # designed "message" contacts >=1 of the tm_message_reader hotspots
  tm6_opening_proxy: optional            # explicit-state GaMD: TM6 outward vs inactive; retrospective-only
  forbid_ecl3_clamp: true
  confidence: LOW                        # flagged everywhere; functional assay is the only verdict

novelty:                     # eligibility hard gate; portal is the authority
  seq_id_max_pct: 30         # MMseqs2 vs SwissProt+PDB+patents+Ab-DBs
  struct_tm_max: 0.5         # Foldseek/TM-align (sub-moderate); helical bundles may cap at level 3 structurally
  known_agonist_id_max_pct: 30   # hard-avoid similarity to GLP-1/exendin/glucagon/semaglutide
  tools: [mmseqs2, foldseek]

developability:              # consensus-drop only when worst-tier on >=2 orthogonal axes (note 06; TNF lesson)
  unpaired_cys: 0            # prefer 0 free Cys (disulfide pairs OK if intended)
  esmfold_monomer_plddt_floor: null   # single-seq monomer fold = best de-novo expression predictor (~AUROC 0.72)
  sap_ceiling: null          # surface aggregation propensity
  antibody: [TAP_5metric, cdr_liability_motifs]   # only for nanobody/scfv/fab

portfolio:                   # hedge wet-lab risk (feedback-diverse-not-cousins)
  n_designs_max: 20
  cap_per_lineage: 2
  spread_across: [mechanism, fold, generative_method]
